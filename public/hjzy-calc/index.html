<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#203b35">
<title>弘峻莊園拆款計算機</title>
<style>
:root{--ink:#162421;--muted:#66726e;--line:#e1d9cc;--gold:#b28a4c;--green:#203b35;--soft:#f5f1e8}*{box-sizing:border-box}html,body{height:100%;margin:0}body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",Arial,sans-serif;background:linear-gradient(180deg,#f6efe2 0,#fbfaf7 330px,#f2f0ea 100%)}button,input{font:inherit}.app{width:min(100%,760px);height:100dvh;min-height:100dvh;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,255,255,.78)}header{position:relative;overflow:hidden;flex:0 0 auto;padding:22px 20px 19px;color:white;background:linear-gradient(135deg,#203b35,#142724);border-bottom:4px solid var(--gold)}header:after{content:"";position:absolute;right:-48px;top:-64px;width:190px;height:190px;border:1px solid rgba(239,228,206,.42);transform:rotate(18deg)}.eyebrow{position:relative;margin:0 0 7px;color:#efe4ce;font-size:12px;font-weight:800;letter-spacing:.14em}h1{position:relative;margin:0;font-family:"Songti TC","Noto Serif TC",serif;font-size:38px;line-height:1.08}.sub{position:relative;margin:9px 0 0;color:rgba(255,255,255,.82);font-size:14px}.inputs{flex:0 0 auto;padding:14px 18px;background:white;border-bottom:1px solid var(--line)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{min-width:0}label,.total-label{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;color:var(--muted);font-size:12px;font-weight:800}label span,.total-label span{color:#9a8b72;font-size:10px;letter-spacing:.08em}.control{display:flex;align-items:center;min-height:44px;padding:0 11px;background:white;border:1px solid var(--line);border-radius:8px}.control:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(178,138,76,.16)}input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:16px;font-weight:800}input::placeholder{color:#b7b0a5;font-weight:500}.unit{flex:0 0 auto;margin-left:6px;color:var(--gold);font-size:12px;font-weight:900}.total-card{margin-top:10px;padding:10px;background:linear-gradient(135deg,#f8f3e8,#eef5f0);border:1px solid #e3d7bf;border-radius:8px}.total-card .control{min-height:50px;border-color:rgba(178,138,76,.45)}.total-card input{text-align:right;font-size:31px;font-variant-numeric:tabular-nums}.results{min-height:0;flex:1;display:flex;flex-direction:column;padding:12px 18px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.summary-card{min-width:0;padding:9px;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:8px}.summary-card b{display:block;color:var(--muted);font-size:11px}.summary-card span{display:block;overflow:hidden;margin-top:3px;font-size:14px;font-weight:900;text-overflow:ellipsis;white-space:nowrap}.table{min-height:0;flex:1;display:flex;flex-direction:column;overflow:hidden;background:white;border:1px solid var(--line);border-radius:8px}.head,.row,.total{display:grid;grid-template-columns:minmax(0,1fr) minmax(126px,.52fr) minmax(86px,.32fr);align-items:center;gap:8px}.head{flex:0 0 auto;padding:9px 12px;color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line);font-size:12px;font-weight:900}.head div:nth-child(2),.head div:nth-child(3){text-align:right}.row{min-height:0;flex:1;padding:8px 12px;border-bottom:1px solid #eee9df}.row:nth-child(even){background:#fdfbf7}.name{min-width:0}.name strong{display:block;font-size:15px;line-height:1.25}.name small{display:block;margin-top:2px;color:var(--muted);font-size:11px;line-height:1.25}.ratio{color:#846c43;text-align:right;font-size:13px;font-weight:900;line-height:1.22}.value{text-align:right;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}.total{flex:0 0 auto;padding:13px 12px;color:white;background:var(--green)}.total small,.total .ratio,.total .value{color:white}.total .value{font-size:21px}.actions{flex:0 0 auto;padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:rgba(251,250,247,.92);border-top:1px solid var(--line);backdrop-filter:blur(14px)}.print{width:100%;min-height:48px;color:white;background:var(--gold);border:0;border-radius:8px;cursor:pointer;font-size:15px;font-weight:900;letter-spacing:.04em}@media(max-width:560px){header{height:13dvh;min-height:86px;padding:12px 14px 10px;border-bottom-width:3px}.eyebrow{font-size:10px;margin-bottom:4px}h1{font-size:28px}.sub{font-size:12px;margin-top:5px}.inputs{height:32dvh;min-height:226px;padding:9px 10px}.grid{gap:7px}label,.total-label{font-size:10px;margin-bottom:4px}label span,.total-label span{font-size:8px}.control{min-height:38px;padding:0 9px;border-radius:7px}input{font-size:15px}.unit{font-size:11px;margin-left:5px}.total-card{margin-top:8px;padding:8px}.total-card .control{min-height:42px}.total-card input{font-size:25px}.results{padding:7px 9px 6px}.summary{display:none}.head,.row,.total{grid-template-columns:minmax(0,1fr) 86px 74px;gap:5px}.head{padding:5px 8px;font-size:10px}.row{padding:4px 8px}.name strong{font-size:11px;line-height:1.08}.name small{font-size:8px;line-height:1.08}.ratio{font-size:9px}.value{font-size:12px}.total{padding:8px}.total .value{font-size:17px}.actions{padding:7px 10px calc(7px + env(safe-area-inset-bottom))}.print{min-height:42px;font-size:14px}}@media(max-width:380px){.inputs{height:34dvh;min-height:234px}.head,.row,.total{grid-template-columns:minmax(0,1fr) 78px 70px;gap:4px}.name strong{font-size:10px}.name small{font-size:7.5px}.ratio{font-size:8.4px}.value{font-size:11.5px}}@media print{@page{size:A4;margin:0}html,body{margin:0!important;background:#fff!important}.app{display:none!important}}
</style>
</head>
<body>
<main class="app">
<header><p class="eyebrow">PAYMENT CALCULATOR</p><h1>弘峻莊園</h1><p class="sub">專屬拆款計算機</p></header>
<section class="inputs"><div class="grid"><div class="field"><label for="unitInput">戶別 <span>UNIT</span></label><div class="control"><input id="unitInput" placeholder="例如 A1-5F"></div></div><div class="field"><label for="sizeInput">戶別坪數 <span>SIZE</span></label><div class="control"><input id="sizeInput" type="number" step="0.01" inputmode="decimal" placeholder="0.00"><span class="unit">坪</span></div></div><div class="field"><label for="parkInput">車位 <span>PARKING</span></label><div class="control"><input id="parkInput" placeholder="例如 B2-18"></div></div><div class="field"><label for="parkPriceInput">車位價格 <span>PRICE</span></label><div class="control"><input id="parkPriceInput" type="number" step="1" inputmode="numeric" placeholder="0"><span class="unit">萬</span></div></div></div><div class="total-card"><label class="total-label" for="totalPrice">物業總額 <span>萬元</span></label><div class="control"><input id="totalPrice" type="number" value="733" step="1" inputmode="numeric"><span class="unit">萬</span></div></div></section>
<section class="results"><div class="summary" id="summary"></div><div class="table"><div class="head"><div>款項</div><div>拆款方式</div><div>金額</div></div><div id="rows"></div><div class="total"><div class="name"><strong>合計總額</strong><small>TOTAL</small></div><div class="ratio">100%</div><div class="value" id="totalDisplay">0 萬</div></div></div></section>
<footer class="actions"><button class="print" id="printButton" type="button">產生正式報表</button></footer>
</main>
<script>
const f={unit:unitInput,size:sizeInput,parking:parkInput,parkingPrice:parkPriceInput,total:totalPrice};
const items=[['訂金','','固定5萬',p=>p.dep],['簽約金','','總價 6% 減訂金',p=>p.sign],['工程期款第一期','第一區屋頂版完成，開工後約第 19 個月','2%',p=>p.e1],['工程期款第二期','第二區屋頂版完成，開工後約第 26 個月','2%',p=>p.e2],['工程期款第三期','第三區屋頂版完成，開工後約第 32 個月','2%',p=>p.e3],['落架款','全區落架完成，開工後約第 40 個月','3%',p=>p.seal],['銀行貸款','','80%',p=>p.bank],['交屋保留款','','5%',p=>p.handOver]];
function money(v){return `${Number(v||0).toLocaleString('zh-TW')} 萬`}function show(v,s=''){v=String(v||'').trim();return v?`${v}${s}`:'—'}function calcParts(total){const dep=5,sign=Math.ceil(total*.06)-dep,e1=Math.round(total*.02),e2=Math.round(total*.02),e3=Math.round(total*.02),bank=Math.floor(total*.8),handOver=Math.ceil(total*.05),seal=total-(dep+sign+e1+e2+e3+bank+handOver);return{dep,sign,e1,e2,e3,bank,handOver,seal}}function card(k,v){const d=document.createElement('div');d.className='summary-card';const b=document.createElement('b');b.textContent=k;const s=document.createElement('span');s.textContent=v;d.append(b,s);return d}function row(i,p){const d=document.createElement('div');d.className='row';const n=document.createElement('div');n.className='name';const t=document.createElement('strong');t.textContent=i[0];const m=document.createElement('small');m.textContent=i[1];n.append(t,m);const r=document.createElement('div');r.className='ratio';r.textContent=i[2];const v=document.createElement('div');v.className='value';v.textContent=money(i[3](p));d.append(n,r,v);return d}function snapshot(){const total=parseFloat(f.total.value)||0,p=calcParts(total);return{total,p,summary:[['戶別',show(f.unit.value)],['坪數',show(f.size.value,' 坪')],['車位',show(f.parking.value)],['車位價',show(f.parkingPrice.value,' 萬')]],rows:items.map(i=>({name:i[0],note:i[1],ratio:i[2],value:i[3](p)}))}}function render(){const s=snapshot();summary.replaceChildren(...s.summary.map(x=>card(x[0],x[1])));rows.replaceChildren(...items.map(i=>row(i,s.p)));totalDisplay.textContent=money(s.total)}
function drawText(ctx,str,x,y,size,weight='400',color='#111',align='left'){ctx.fillStyle=color;ctx.font=`${weight} ${size}px -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",Arial,sans-serif`;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillText(str,x,y)}
function printText(ctx,str,x,y,size,weight='600',align='left'){drawText(ctx,str,x,y,size,weight,'#111',align)}
function buildReportImage(){const s=snapshot(),c=document.createElement('canvas'),w=1240,h=1754;c.width=w;c.height=h;const ctx=c.getContext('2d');const ink='#111',gray='#3a3a3a',line='#6f6a60',soft='#f6f4ef',gold='#a97d35',green='#183b33';ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);const x=76,ww=1088;ctx.strokeStyle=green;ctx.lineWidth=6;ctx.strokeRect(x,70,ww,150);ctx.fillStyle=gold;ctx.fillRect(x,220,ww,7);drawText(ctx,'弘峻莊園',x+32,104,44,'800',ink);drawText(ctx,'拆款計算報表',x+32,158,24,'700',gray);drawText(ctx,'PAYMENT SCHEDULE',x+ww-32,112,18,'800',gray,'right');drawText(ctx,new Date().toLocaleString('zh-TW',{hour12:false}),x+ww-32,158,18,'500',gray,'right');const boxY=256,boxH=86,boxW=ww/4;ctx.lineWidth=2;for(let i=0;i<4;i++){ctx.fillStyle=i%2? '#fff':'#faf9f6';ctx.fillRect(x+i*boxW,boxY,boxW,boxH);ctx.strokeStyle=line;ctx.strokeRect(x+i*boxW,boxY,boxW,boxH);drawText(ctx,s.summary[i][0],x+i*boxW+20,274,18,'800',gray);printText(ctx,s.summary[i][1],x+i*boxW+20,307,24,'800')}const tableY=382,rowH=108;const c1=x,c2=x+235,c3=x+735,c4=x+895,c5=x+ww;ctx.fillStyle=soft;ctx.fillRect(x,tableY,ww,58);ctx.strokeStyle=ink;ctx.lineWidth=3;ctx.strokeRect(x,tableY,ww,58);[[c2,''],[c3,''],[c4,'']].forEach(([cx])=>{ctx.beginPath();ctx.moveTo(cx,tableY);ctx.lineTo(cx,tableY+58);ctx.stroke()});printText(ctx,'款項',c1+18,400,20,'800');printText(ctx,'備註',c2+18,400,20,'800');printText(ctx,'拆款方式',c4-18,400,20,'800','right');printText(ctx,'金額',c5-18,400,20,'800','right');let y=tableY+58;ctx.lineWidth=2;s.rows.forEach((r,i)=>{ctx.fillStyle=i%2?'#fff':'#fbfaf7';ctx.fillRect(x,y,ww,rowH);ctx.strokeStyle=line;ctx.strokeRect(x,y,ww,rowH);[c2,c3,c4].forEach(cx=>{ctx.beginPath();ctx.moveTo(cx,y);ctx.lineTo(cx,y+rowH);ctx.stroke()});printText(ctx,r.name,c1+18,y+35,23,'800');printText(ctx,r.note||'—',c2+18,y+38,r.note?18:20,r.note?'700':'600');printText(ctx,r.ratio,c4-18,y+38,r.ratio.length>7?18:23,'800','right');printText(ctx,money(r.value),c5-18,y+32,30,'900','right');y+=rowH});ctx.fillStyle='#fff';ctx.fillRect(x,y,ww,116);ctx.strokeStyle=green;ctx.lineWidth=6;ctx.strokeRect(x,y,ww,116);ctx.fillStyle=gold;ctx.fillRect(x,y,ww,7);printText(ctx,'合計總額',c1+18,y+35,28,'900');printText(ctx,'TOTAL',c1+18,y+72,17,'700');printText(ctx,'100%',c4-18,y+44,23,'900','right');printText(ctx,money(s.total),c5-18,y+30,42,'900','right');drawText(ctx,'所有金額單位：萬元',x,1640,18,'600',gray);drawText(ctx,'本報表由弘峻莊園拆款計算機產生',x+ww,1640,18,'600',gray,'right');return c.toDataURL('image/png')}
function printReportImage(){const dataUrl=buildReportImage();const w=window.open('','_blank');if(!w){alert('請允許彈出視窗後再按一次列印。');return}w.document.open();w.document.write(`<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>弘峻莊園拆款報表</title><style>@page{size:A4;margin:0}html,body{margin:0;background:#fff}img{display:block;width:100%;height:auto}@media print{html,body{width:210mm;height:297mm;overflow:hidden}img{width:210mm;height:297mm;object-fit:contain}}</style></head><body><img id="report" alt="弘峻莊園拆款報表" src="${dataUrl}"><script>const img=document.getElementById('report');img.onload=()=>setTimeout(()=>window.print(),350);<\/script></body></html>`);w.document.close()}
Object.values(f).forEach(x=>x.addEventListener('input',render));printButton.addEventListener('click',printReportImage);render();
</script>
</body>
</html>
